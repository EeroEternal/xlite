[package]
name = "xlite-h1-pool"
version = "0.1.0"
edition = "2024"
authors = ["lipicoder@qq.com"]
description = "Native HTTP/1.1 upstream connection pool: one connection serves one request at a time, so a per-host connection cap is a per-host in-flight cap — the HTTP/1.1 counterpart of xlite-h2-pool (experimental, opt-in)"
license = "MIT"

[dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }
