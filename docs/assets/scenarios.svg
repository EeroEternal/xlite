<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="100%" height="auto" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="980" height="340" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Top KPI Banner (4 Cards) -->
  <g filter="url(#shadow)" text-anchor="middle">
    <rect x="20" y="16" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="130" y="38" font-size="16" font-weight="800" fill="#1D4ED8">0 JSON DOM / Chunk</text>
    <text x="130" y="56" font-size="10.5" font-weight="500" fill="#64748B">Raw Bytes SSE Passthrough</text>

    <rect x="260" y="16" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="370" y="38" font-size="16" font-weight="800" fill="#D97706">402 / 429 / 5xx</text>
    <text x="370" y="56" font-size="10.5" font-weight="500" fill="#64748B">Pre-Byte Channel Failover</text>

    <rect x="500" y="16" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="610" y="38" font-size="16" font-weight="800" fill="#047857">SETTINGS-Aware H2</text>
    <text x="610" y="56" font-size="10.5" font-weight="500" fill="#64748B">Auto-Scales TCP Conns</text>

    <rect x="740" y="16" width="220" height="56" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="850" y="38" font-size="16" font-weight="800" fill="#0F172A">xLB + Multi-xlite</text>
    <text x="850" y="56" font-size="10.5" font-weight="500" fill="#64748B">Disjoint Catalogs (0 Shared DB)</text>
  </g>

  <!-- ==================== LEFT PANEL: CHANNEL FAILOVER ==================== -->
  <g filter="url(#shadow)">
    <rect x="20" y="86" width="460" height="238" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  </g>
  <text x="38" y="110" font-size="12.5" font-weight="700" fill="#0F172A">Scenario A · Priority + Weight &amp; 402/429/5xx Failover</text>
  <text x="38" y="126" font-size="10.5" fill="#64748B">Switches channels before first client byte on quota or upstream error</text>

  <!-- Client Box -->
  <g text-anchor="middle">
    <rect x="34" y="166" width="84" height="58" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.4"/>
    <text x="76" y="187" font-size="12" font-weight="700" fill="#1E293B">Client</text>
    <text x="76" y="203" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#2563EB">mimo-v2.6</text>
    <text x="76" y="216" font-size="9.5" fill="#64748B">SSE stream</text>
  </g>

  <path d="M 118 195 L 148 195" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow-slate)"/>

  <!-- xlite Box -->
  <g text-anchor="middle">
    <rect x="152" y="140" width="126" height="112" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
    <text x="215" y="161" font-size="12.5" font-weight="800" fill="#1E3A8A">xlite Router</text>
    <rect x="162" y="170" width="106" height="22" rx="4" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1"/>
    <text x="215" y="185" font-size="9.5" font-weight="600" fill="#1D4ED8">1. Peek &quot;model&quot;</text>
    <rect x="162" y="198" width="106" height="22" rx="4" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1"/>
    <text x="215" y="213" font-size="9.5" font-weight="600" fill="#B45309">2. Catch 402/429</text>
    <rect x="162" y="224" width="106" height="22" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
    <text x="215" y="239" font-size="9.5" font-weight="600" fill="#047857">3. Failover Tier 1</text>
  </g>

  <!-- Arrows xlite -> Tier 0 & Tier 1 -->
  <path d="M 278 174 C 298 174, 302 164, 320 164" fill="none" stroke="#D97706" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow-amber)"/>
  <text x="299" y="158" text-anchor="middle" font-size="9.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#B45309">402</text>

  <path d="M 278 222 C 298 222, 302 232, 320 232" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>
  <text x="299" y="244" text-anchor="middle" font-size="9.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#047857">200</text>

  <!-- Tier 0 & Tier 1 Channels -->
  <g text-anchor="middle">
    <rect x="324" y="138" width="140" height="52" rx="6" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.4"/>
    <text x="394" y="159" font-size="11.5" font-weight="700" fill="#0F172A">Tier 0 · Pay-Go Key</text>
    <text x="394" y="177" font-size="10" fill="#B45309">402 Quota Exhausted</text>

    <rect x="324" y="204" width="140" height="52" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
    <text x="394" y="225" font-size="11.5" font-weight="700" fill="#065F46">Tier 1 · Token Plan</text>
    <text x="394" y="243" font-size="10" fill="#047857">200 OK · Raw Bytes SSE</text>
  </g>

  <!-- Bottom Pill Left -->
  <rect x="34" y="274" width="430" height="34" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="249" y="295" text-anchor="middle" font-size="10.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1D4ED8">64 MiB body limit · 15s SSE : keep-alive heartbeat</text>

  <!-- ==================== RIGHT PANEL: xLB + MULTI-XLITE CLUSTER ==================== -->
  <g filter="url(#shadow)">
    <rect x="500" y="86" width="460" height="238" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  </g>
  <text x="518" y="110" font-size="12.5" font-weight="700" fill="#0F172A">Scenario B · xLB + Heterogeneous xlite Cluster</text>
  <text x="518" y="126" font-size="10.5" fill="#64748B">Scale specialized xlite nodes behind xLB without syncing catalogs</text>

  <!-- Stage 1 -->
  <rect x="518" y="138" width="424" height="38" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/>
  <rect x="526" y="146" width="84" height="22" rx="4" fill="#2563EB"/>
  <text x="568" y="161" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">1. Disjoint</text>
  <text x="622" y="161" font-size="11" font-weight="600" fill="#1E293B">xlite #1 serves DeepSeek · xlite #2 serves MiMo</text>

  <!-- Stage 2 -->
  <rect x="518" y="182" width="424" height="38" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/>
  <rect x="526" y="190" width="84" height="22" rx="4" fill="#D97706"/>
  <text x="568" y="205" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">2. 404 Reroute</text>
  <text x="622" y="205" font-size="11" font-weight="600" fill="#92400E">xLB drains 404, pools socket &amp; replays to #2</text>

  <!-- Stage 3 -->
  <rect x="518" y="226" width="424" height="38" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.2"/>
  <rect x="526" y="234" width="84" height="22" rx="4" fill="#059669"/>
  <text x="568" y="249" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">3. Long Context</text>
  <text x="622" y="249" font-size="11" font-weight="600" fill="#065F46">Replays &lt;= 64 MiB prompt · Frees to 0 B on 200</text>

  <!-- Stage 4 -->
  <rect x="518" y="270" width="424" height="38" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <rect x="526" y="278" width="84" height="22" rx="4" fill="#475569"/>
  <text x="568" y="293" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">4. Liveness</text>
  <text x="622" y="293" font-size="11" font-weight="600" fill="#334155">StallGuard + instant H2 RST_STREAM(CANCEL)</text>
</svg>
