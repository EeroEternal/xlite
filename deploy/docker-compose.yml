# Run from this directory:
#   cp env.example .env
#   docker compose up -d
#   docker compose run --rm xlite import /opt/xlite/examples/catalog.yaml --replace
#
# For multi-replica high availability (starts a second xlite replica on :8081):
#   docker compose --profile ha up -d

name: xlite

services:
  redis:
    image: redis:8.8
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  xlite:
    build:
      context: ..
      dockerfile: Dockerfile
    image: xlite:0.8.0
    environment:
      REDIS_URL: redis://redis:6379
      XLITE_UPSTREAM_H2C: ${XLITE_UPSTREAM_H2C:-1}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      PORT: ${PORT:-8080}
      LISTEN_HOST: "0.0.0.0"
      XLITE_UPSTREAM_MAX_CONNS_PER_HOST: ${XLITE_UPSTREAM_MAX_CONNS_PER_HOST:-32}
      TOKIO_WORKER_THREADS: ${TOKIO_WORKER_THREADS:-8}
    ports:
      - "8080:8080"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    depends_on:
      redis:
        condition: service_healthy

  xlite-2:
    profiles: ["ha"]
    image: xlite:0.8.0
    environment:
      REDIS_URL: redis://redis:6379
      XLITE_UPSTREAM_H2C: ${XLITE_UPSTREAM_H2C:-1}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      PORT: ${PORT:-8080}
      LISTEN_HOST: "0.0.0.0"
      XLITE_UPSTREAM_MAX_CONNS_PER_HOST: ${XLITE_UPSTREAM_MAX_CONNS_PER_HOST:-32}
      TOKIO_WORKER_THREADS: ${TOKIO_WORKER_THREADS:-8}
    ports:
      - "8081:8080"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    depends_on:
      redis:
        condition: service_healthy
