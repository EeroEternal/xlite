[workspace]
members = [".", "crates/xlite-h2-pool"]
resolver = "2"

[package]
name = "xlite"
version = "0.6.1"
edition = "2024"
description = "Thin OpenAI-compatible AI gateway. Simple channel routing, streaming passthrough."

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["json", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
h2 = { version = "0.4", features = ["stream"] }
bytes = "1"
arc-swap = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
redis = { version = "0.32", default-features = false, features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
sha2 = "0.10"
hmac = "0.12"
anyhow = "1.0"
thiserror = "2"
rand = "0.9"
http = "1"
futures-util = "0.3"
url = "2"
dotenvy = "0.15"
xlite-h2-pool = { path = "crates/xlite-h2-pool" }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.6"

[profile.release]
lto = "fat"
codegen-units = 1

[dev-dependencies]
tokio-test = "0.4"

[lints.clippy]
too_many_arguments = { level = "allow" }
